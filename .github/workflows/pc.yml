name: Compilar Nova para PC (Windows)

on:
  push:
    branches: [main]
    paths: ["pc/**", ".github/workflows/pc.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Instalar dependencias
        working-directory: pc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verificar que todo importa bien
        working-directory: pc
        env:
          ANTHROPIC_API_KEY: sk-ant-prueba
        run: python -c "import config, herramientas, cerebro, voz, instalar_modelo; print(len(herramientas.REGISTRO), 'herramientas OK')"

      - name: Armar Nova.exe
        working-directory: pc
        run: >
          pyinstaller main.py --onefile --console --name Nova --noconfirm
          --collect-all vosk
          --collect-all edge_tts
          --collect-data speech_recognition
          --collect-data certifi
          --hidden-import pyttsx3.drivers
          --hidden-import pyttsx3.drivers.sapi5

      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pc/dist/Nova.exe Nova.exe
          gh release delete pc-ultima --yes --cleanup-tag || true
          gh release create pc-ultima Nova.exe \
            --title "Nova para PC - última versión" \
            --notes "Compilada desde ${GITHUB_SHA::7}. Bajá Nova.exe y abrilo con doble clic. La primera vez te pide la clave y descarga el modelo de voz."
