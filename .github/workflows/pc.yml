name: Compilar Nova para PC (Windows)

on:
  push:
    branches: [main, master]
    paths: ["pc/**", ".github/workflows/pc.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Instalar dependencias
        working-directory: pc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verificar que todo importa bien
        working-directory: pc
        env:
          GEMINI_API_KEY: clave-de-prueba-para-importar
        run: python -c "import config, herramientas, cerebro, voz, rapidos, nucleo, app, instalar_modelo, libreta, vinculo, actualizar, webview; print(len(herramientas.REGISTRO), 'herramientas OK')"

      - name: Grabar el número de versión
        working-directory: pc
        shell: bash
        run: echo "${{ github.run_number }}" > version.txt

      - name: Armar Nova.exe (con ventana)
        working-directory: pc
        run: >
          pyinstaller main.py --onefile --windowed --name Nova --noconfirm
          --add-data "interfaz;interfaz"
          --add-data "version.txt;."
          --hidden-import actualizar
          --hidden-import vinculo
          --hidden-import libreta
          --collect-all vosk
          --collect-all edge_tts
          --collect-all webview
          --collect-data speech_recognition
          --collect-data certifi
          --hidden-import pyttsx3.drivers
          --hidden-import pyttsx3.drivers.sapi5
          --hidden-import clr

      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pc/dist/Nova.exe Nova.exe
          gh release delete pc-ultima --yes --cleanup-tag || true
          gh release create pc-ultima Nova.exe \
            --title "Nova para PC - última versión" \
            --notes "Versión 1.${{ github.run_number }}, compilada desde ${GITHUB_SHA::7}. Bajá Nova.exe y abrilo con doble clic. La primera vez te pide la clave gratis de Gemini en los ajustes."
